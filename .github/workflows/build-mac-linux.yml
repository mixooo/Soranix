name: Build Mac & Linux

# Run it from the Actions tab (Run workflow). The packages appear under the run's "Artifacts".
# Mac builds need a castLabs EVS account for Spotify playback: add the repository secrets
# EVS_ACCOUNT_NAME and EVS_PASSWD (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      release:
        description: Also publish a GitHub Release (pre-release) with the packages
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
            name: Soranix-macOS
          - os: ubuntu-latest
            target: --linux
            files: |
              dist/*.AppImage
              dist/*.deb
            name: Soranix-Linux
    runs-on: ${{ matrix.os }}
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      EVS_NO_ASK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        # electron-builder downloads the castLabs Electron for each target itself
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"

      - name: castLabs EVS login (Mac VMP signing)
        if: runner.os == 'macOS' && env.EVS_ACCOUNT_NAME != ''
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account -n reauth

      - name: Build
        run: npx --yes electron-builder@26.18.0 ${{ matrix.target }} --publish never
        env:
          PYTHON: python

      - name: Smoke test (starts and stays up for 25 s)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN="dist/mac-arm64/Soranix.app/Contents/MacOS/Soranix"; RUN=""
          else
            BIN="dist/linux-unpacked/soranix"; RUN="xvfb-run -a"
            ARGS="--no-sandbox --ozone-platform=x11"
          fi
          $RUN "$BIN" $ARGS > run.log 2>&1 &
          sleep 25
          if pgrep -f "$BIN" > /dev/null; then echo "Soranix is running"; ALIVE=1; else echo "::error::Soranix exited early"; ALIVE=0; fi
          echo "----- app output"; cat run.log
          for f in ~/.config/Soranix/soranix.log ~/.config/soranix/soranix.log "$HOME/Library/Application Support/Soranix/soranix.log" "$HOME/Library/Application Support/soranix/soranix.log"; do
            [ -f "$f" ] && { echo "----- page log: $f"; cat "$f"; }
          done
          pkill -f "$BIN" || true
          [ "$ALIVE" = 1 ]

      - name: Note about Mac playback
        if: runner.os == 'macOS' && env.EVS_ACCOUNT_NAME == ''
        run: echo "::warning::No EVS_ACCOUNT_NAME secret, so the Mac build is not VMP-signed and Spotify will not play in it."

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # The release for this version (made by publish.ps1 with the Windows MSI) gets the Mac and
      # Linux files added, plus a short section in its notes. The Windows updater only looks at
      # the .msi, so it is unaffected. No such release yet: a separate pre-release v<version>-mac-linux.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.EVS_ACCOUNT_NAME != '' }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la out
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" out/* --clobber
            BODY=$(gh release view "v$V" --json body --jq .body)
            # notes that already name the Mac download were done before (by hand or by this job)
            if ! grep -q "arm64.dmg" <<< "$BODY"; then
              SECTION=$(sed "s/<version>/$V/g" .github/release-mac-linux-section.md)
              if [ "$SIGNED" = "true" ]; then
                SECTION=$(sed '/<!--unsigned-->/,/<!--\/unsigned-->/d' <<< "$SECTION")
              else
                SECTION=$(sed '/<!--\/\{0,1\}unsigned-->/d' <<< "$SECTION")
              fi
              printf '%s\n\n## Mac & Linux (test builds)\n\n%s\n' "$BODY" "$SECTION" > notes.md
              gh release edit "v$V" --notes-file notes.md
            fi
          else
            sed "s/<version>/$V/g" RELEASE-MAC-LINUX.md > notes.md
            if gh release view "v$V-mac-linux" > /dev/null 2>&1; then
              gh release upload "v$V-mac-linux" out/* --clobber
            else
              gh release create "v$V-mac-linux" out/* --target "$GITHUB_SHA" --prerelease \
                --title "Soranix $V for Mac & Linux (test build)" --notes-file notes.md
            fi
          fi
